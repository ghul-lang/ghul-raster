# CI/CD pipeline. 

name: CICD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

  pull_request:
  push:
    branches: [master, main]

# Serialise pushes to main so two concurrent merges don't compute the same
# version number; for pull requests, cancel any superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor. VERSION
    # is code-owned, so raising it for a non-patch release requires the code
    # owner's review (a #major/#minor marker can no longer trigger a bump). A
    # workflow_dispatch `version` input overrides outright; pull request builds
    # get a -beta.<run> prerelease so they never collide with a real release.
    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        version: ${{ github.event.inputs.version }}
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    container: 
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 5
    needs: [version]

    steps:
    - uses: actions/checkout@v7

    - name: Restore local tools
      run: dotnet tool restore

    - name: Run unit tests
      run: dotnet test unit-tests

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    container: 
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 5
    needs: [version]

    steps:
    - uses: actions/checkout@v7

    - name: .NET tool restore
      run: dotnet tool restore

    - name: Build
      run: dotnet build

    - name: Integration tests
      run: dotnet ghul-test --use-dotnet-build integration-tests

  wasm-tests:
    name: Wasm integration tests
    runs-on: ubuntu-latest

    timeout-minutes: 15
    needs: [version]

    steps:
    - uses: actions/checkout@v7

    # A wasm program runs under Node.js, which needs WebAssembly GC: on by
    # default from Node.js 22.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: .NET tool restore
      run: dotnet tool restore

    - name: Build and run the integration tests for the wasm target
      run: dotnet ghul-test --use-ghul-cli --ghul "dotnet ghul" --target wasm integration-tests

  build:
    name: Build the package
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 10
    needs: [version]

    steps:
    - uses: actions/checkout@v7

    - name: .NET tool restore
      run: dotnet tool restore

    - name: Create package
      run: dotnet pack -p:Version=${{ needs.version.outputs.package }}

    - name: Upload .NET package artefact
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

  package-tests:
    name: Test the package
    runs-on: ubuntu-latest

    container: 
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 10
    needs: [version,build]

    steps:
    - uses: actions/checkout@v7

    - name: Download template package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    # TODO: add actual package tests here

  publish-package:
    name: Publish the package
    runs-on: ubuntu-latest

    container: 
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 10
    needs: [build, unit-tests, integration-tests, wasm-tests, package-tests]

    permissions:
      # Lets the job ask GitHub for the short-lived token nuget.org trades for
      # a publishing key. Nothing here holds a NuGet secret.
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Download template package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    # Trusted publishing: nuget.org trades a token GitHub signs for this
    # workflow for a publishing key that lasts an hour and is spent once. No
    # long-lived key exists to leak or to rotate, and the policy on nuget.org
    # names this repository and this file, so no other workflow can publish.
    #
    # The key expires, so this sits immediately before the push rather than
    # earlier in the job.
    - name: Ask nuget.org for a publishing key
      id: login
      if: ${{ github.event_name == 'push' }}
      uses: NuGet/login@v1
      with:
        # The nuget.org profile name, which is not an email address.
        user: ${{ secrets.NUGET_USER }}

    - name: Publish package to NuGet
      if: ${{ github.event_name == 'push' }}
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols

  create-release:
    needs: [version, publish-package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name == 'push' }}

    permissions:
      contents: 'write'

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.raster.${{ needs.version.outputs.package }}.nupkg \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt
